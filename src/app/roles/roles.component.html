<div class="space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold">Roles</h1>
    <a
      routerLink="/roles/new"
      class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
    >
      Add Role
    </a>
  </div>

  @if (loading()) {
    <p class="text-gray-500">Loading...</p>
  } @else if (roles().length === 0) {
    <p class="text-gray-500">No roles found.</p>
  } @else {
    <table class="min-w-full bg-white border border-gray-200 rounded-lg overflow-hidden">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Role Name</th>
          <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (role of roles(); track role.id) {
          <tr class="border-t border-gray-200 hover:bg-gray-50">
            <td class="px-4 py-2 text-sm text-gray-900">{{ role.name }}</td>
            <td class="px-4 py-2 text-sm text-gray-900">
              <button
                (click)="editRole(role.id!)"
                class="px-3 py-1 text-sm bg-gray-100 hover:bg-gray-200 rounded border border-gray-300"
              >
                Edit
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
